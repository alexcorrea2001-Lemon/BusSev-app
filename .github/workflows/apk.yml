# Compila el APK de BusSev.
# - Cada vez que subes cambios, o a mano: pestaña Actions → "Compilar APK" → Run workflow.
# - Además, el día 1 de cada mes revisa si TUSSAM ha publicado horarios nuevos y,
#   si los hay, compila una versión nueva sola.
# El APK aparece en la pestaña Releases del repositorio.
# Para cambiar el nombre de la versión (v1.1.2, v1.1.3…) edita el archivo VERSION.
name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión: el NOMBRE (p. ej. 1.1.2) lo pones tú en el archivo VERSION del repositorio.
      # El NÚMERO de compilación lo pone GitHub (su contador + 100) y siempre sube: es lo que
      # Android usa para dejar instalar la nueva encima, aunque el nombre no cambie.
      - name: Número de versión
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION 2>/dev/null || true)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::El archivo VERSION debe tener algo como 1.1.2 (ahora tiene: '$VERSION')"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NUMERO=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "Versión $VERSION, compilación $((GITHUB_RUN_NUMBER + 100))"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Horarios oficiales de TUSSAM (paradas, líneas y recorridos). Si falla, se usan los que ya hay.
      - name: Actualizar paradas y recorridos (datos oficiales)
        continue-on-error: true
        timeout-minutes: 8
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: bash scripts/actualizar_datos.sh

      - name: Guardar los datos nuevos en el repositorio
        id: datos
        run: |
          if git diff --quiet -- www/data.js geojson/lineas.json; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
            echo "Los datos y el trazado ya estaban al día."
          else
            echo "cambio=si" >> "$GITHUB_OUTPUT"
            git config user.name "BusSev (automático)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add www/data.js geojson/lineas.json
            if [ -f www/novedades.json ]; then git add www/novedades.json; fi
            git commit -m "Datos y trazado oficial de TUSSAM actualizados"
            git push || echo "No se han podido guardar en el repositorio (no pasa nada: van igual en el APK)."
          fi

      # En la revisión mensual, si no hay nada nuevo, no se compila (no se llena Releases de copias)
      - name: ¿Hace falta compilar?
        id: seguir
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.datos.outputs.cambio }}" = "no" ]; then
            echo "si=no" >> "$GITHUB_OUTPUT"; echo "Revisión mensual: sin cambios, no se compila."
          else
            echo "si=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Capacitor
        if: steps.seguir.outputs.si == 'si'
        run: npm ci

      # Recorridos por calle: es un extra. Si el servidor de mapas falla o tarda,
      # NO se detiene la compilación; la app usa líneas rectas entre paradas.
      - name: Calcular recorridos por calle (opcional)
        if: steps.seguir.outputs.si == 'si'
        continue-on-error: true
        timeout-minutes: 18
        env:
          LIMITE_COMPLETO_MIN: "15"
          LIMITE_TOTAL_MIN: "16"
        run: |
          node scripts/recorridos.mjs || echo "Recorridos omitidos; la app usara lineas rectas."

      # Los recorridos se guardan en el repositorio: la próxima vez, si los datos no han cambiado,
      # no se vuelven a calcular (compila en unos minutos menos y no se carga a los servidores de mapas)
      - name: Guardar los recorridos en el repositorio
        if: steps.seguir.outputs.si == 'si'
        continue-on-error: true
        run: |
          if git diff --quiet -- www/recorridos.js; then
            echo "Recorridos sin cambios."
          else
            git config user.name "BusSev (automático)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add www/recorridos.js
            git commit -m "Recorridos por calle actualizados"
            git push || echo "No se han podido guardar (no pasa nada: van igual en el APK)."
          fi

      # Número de versión dentro de la app (para el botón «Buscar actualización» de Ajustes)
      - name: Apuntar la versión
        if: steps.seguir.outputs.si == 'si'
        run: |
          printf '/* Lo escribe GitHub al compilar. */\nwindow.BUSSEV_VERSION = { version: "%s", build: %s, fecha: "%s", repo: "%s" };\n' \
            "$VERSION" "$NUMERO" "$(date -u +%Y-%m-%d)" "${{ github.repository }}" > www/version.js
          cat www/version.js

      # Credenciales de la API de TUSSAM: viven en un Secret del repositorio (nunca en el código).
      # Aquí se escribe www/secrets.js al vuelo, antes de meter la app en el APK.
      - name: Credenciales de TUSSAM
        if: steps.seguir.outputs.si == 'si'
        env:
          TUSSAM_SECRETS_JS: ${{ secrets.TUSSAM_SECRETS_JS }}
        run: |
          if [ -z "$TUSSAM_SECRETS_JS" ]; then
            echo "::error::Falta el secreto TUSSAM_SECRETS_JS (Settings → Secrets and variables → Actions). Mira el README."
            exit 1
          fi
          printf '%s\n' "$TUSSAM_SECRETS_JS" > www/secrets.js
          echo "www/secrets.js creado para el APK."

      - name: Copiar la app al proyecto Android
        if: steps.seguir.outputs.si == 'si'
        run: npx cap sync android

      # La clave de firma vive en los «Secrets» del repositorio (nunca en el código ni en los registros)
      - name: Preparar la firma
        if: steps.seguir.outputs.si == 'si'
        env:
          CLAVE: ${{ secrets.BUSSEV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::error::Falta el secreto BUSSEV_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions). Mira el README."
            exit 1
          fi
          echo "$CLAVE" | base64 -d > "$RUNNER_TEMP/bussev.keystore"
          echo "BUSSEV_KEYSTORE=$RUNNER_TEMP/bussev.keystore" >> "$GITHUB_ENV"

      - name: Compilar
        if: steps.seguir.outputs.si == 'si'
        working-directory: android
        env:
          BUSSEV_KEYSTORE_PASSWORD: ${{ secrets.BUSSEV_KEYSTORE_PASSWORD }}
          BUSSEV_KEY_ALIAS: ${{ secrets.BUSSEV_KEY_ALIAS }}
          BUSSEV_KEY_PASSWORD: ${{ secrets.BUSSEV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PbussevVersionCode=$NUMERO -PbussevVersionName=$VERSION
          rm -f "$RUNNER_TEMP/bussev.keystore"

      - name: Renombrar APK
        if: steps.seguir.outputs.si == 'si'
        run: cp android/app/build/outputs/apk/release/app-release.apk BusSev.apk

      # Si ya existía esta misma versión (la has vuelto a compilar), se sustituye por la nueva
      - name: Quitar la publicación anterior de esta misma versión
        if: steps.seguir.outputs.si == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --cleanup-tag --yes --repo "${{ github.repository }}" || echo "Es una versión nueva."

      # Lo que ha cambiado en líneas, paradas y recorridos (www/novedades.json): va en la descripción de la
      # versión, para que la app lo enseñe en el aviso de actualización antes de descargar.
      - name: Novedades de los datos para la publicación
        if: steps.seguir.outputs.si == 'si'
        run: node scripts/novedades.mjs --publicar www/novedades.json || true

      - name: Publicar en Releases
        if: steps.seguir.outputs.si == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BusSev v${{ env.VERSION }}
          make_latest: true
          body: |
            Descarga **BusSev.apk** desde el móvil y ábrelo para instalarlo (se instala encima, sin perder nada).
            ${{ steps.datos.outputs.cambio == 'si' && 'Incluye los horarios y recorridos oficiales más recientes de TUSSAM.' || '' }}
            Compilación ${{ env.NUMERO }}.

            ${{ env.NOVEDADES_MD }}
            <!-- bussev-build:${{ env.NUMERO }} -->
            <!-- bussev-novedades:${{ env.NOVEDADES_B64 }} -->
          files: BusSev.apk
