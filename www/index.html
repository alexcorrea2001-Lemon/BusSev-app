<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Solo se cargan archivos de la propia app; solo se conecta con TUSSAM y con las teselas del mapa. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://api.github.com https://www.tussam.es https://reddelineas.tussam.es https://recargas.tussam.es https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>BusSev</title>
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <a class="brand" href="#favoritas" aria-label="BusSev, inicio">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo-bg" x="2" y="2" width="28" height="28" rx="8"/><path class="logo-g" d="M10 8h12a2.5 2.5 0 0 1 2.5 2.5V21a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V10.5A2.5 2.5 0 0 1 10 8Zm.3 3v5h11.4v-5ZM10 23h3.2v2.2H10zM18.8 23H22v2.2h-3.2z"/><circle cx="11.6" cy="19.6" r="1.3" fill="var(--albero)"/><circle cx="20.4" cy="19.6" r="1.3" fill="var(--albero)"/></svg>
          <span>BusSev</span>
        </a>
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a class="icon-btn" href="#ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Parada, nº de parada, calle o línea">
        <button type="button" class="search-clear" id="q-clear" aria-label="Borrar búsqueda" hidden>×</button>
      </label>
    </header>

    <main id="main">
      <section class="view" id="view-buscar" hidden aria-label="Resultados de búsqueda"></section>
      <section class="view" id="view-cerca" hidden aria-label="Paradas cerca de ti"></section>
      <section class="view" id="view-favoritas" hidden aria-label="Paradas favoritas"></section>
      <section class="view" id="view-lineas" hidden aria-label="Líneas"></section>
      <section class="view view-map" id="view-mapa" hidden aria-label="Mapa de paradas">
        <div id="map-all" class="map-full"></div>
        <button class="fab" id="btn-locate" type="button" aria-label="Centrar en mi ubicación">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="fab fab-sm" id="btn-buses" type="button" aria-pressed="true" aria-label="Ocultar los autobuses en directo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4 11h16M8 21v-3M16 21v-3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="8" cy="14.5" r="1.1" fill="currentColor"/><circle cx="16" cy="14.5" r="1.1" fill="currentColor"/><path class="tachon" d="M3 3l18 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="fab fab-sm" id="btn-mapfull" type="button" aria-label="Ver el mapa en pantalla completa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="map-zona" id="map-zona" role="status" hidden></div>
        <div class="map-linebar" id="map-linebar"></div>
        <div class="sheet" id="map-sheet" hidden></div>
      </section>
      <section class="view" id="view-tarjeta" hidden aria-label="Tarjeta TUSSAM"></section>
      <section class="view view-detail" id="view-ajustes" hidden aria-label="Ajustes"></section>
      <section class="view view-detail" id="view-ruta" hidden aria-label="Cómo llegar"></section>
      <section class="view view-detail" id="view-parada" hidden aria-label="Parada"></section>
      <section class="view view-detail" id="view-linea" hidden aria-label="Línea"></section>
      <section class="view view-detail" id="view-avisos" hidden aria-label="Avisos de TUSSAM"></section>
      <section class="view view-detail" id="view-tarifas" hidden aria-label="Tarifas de TUSSAM"></section>
    </main>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#favoritas" data-tab="favoritas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Favoritas</span>
      </a>
      <a href="#mapa" data-tab="mapa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-2.5 6 2.5 6-2.5v14.5L15 20.5 9 18l-6 2.5Z M9 3.5V18M15 6v14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Mapa</span>
      </a>
      <a href="#lineas" data-tab="lineas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 6H15a3.5 3.5 0 0 1 0 7H9a3.5 3.5 0 0 0 0 7h6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Líneas</span>
      </a>
      <a href="#tarjeta" data-tab="tarjeta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 9.5h19M6 15h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Tarjeta</span>
      </a>
      <a href="#cerca" data-tab="cerca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="currentColor"/></svg>
        <span>Cerca</span>
      </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="/vendor/maplibre/maplibre-gl-csp.js"></script>
  <script src="/version.js"></script>
  <script src="/data.js"></script>
  <script src="/recorridos.js"></script>
  <script src="/secrets.js"></script>
  <script src="/backend.js"></script>
  <script src="/app.js"></script>
  <script src="/tarjeta.js"></script>
  <script src="/avisos-tussam.js"></script>
  <script src="/tarifas.js"></script>
  <script src="/extras.js"></script>
</body>
</html>
